# Local full stack:  docker compose up --build   ->  UI http://localhost:8080 , API docs http://localhost:8000/docs
# Ollama runs on the HOST (not in this compose file) so you can reuse your GPU/models.
# Inside a container `localhost` is the container itself, hence host.docker.internal below.
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    extra_hosts: ["host.docker.internal:host-gateway"]   # Linux hosts
    ports: ["8000:8000"]
    volumes:
      - tt_data:/data
      - ./models:/models
      - ./data/raw:/data/raw:ro
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  tt_data:
